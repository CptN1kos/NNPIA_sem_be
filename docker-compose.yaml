version: "3.9"
services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: nnpia
      POSTGRES_USER: nnpia
      POSTGRES_PASSWORD: nnpia
    ports:
      - 5432:5432

  app:
    build: .
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/nnpia
      SPRING_DATASOURCE_USERNAME: nnpia
      SPRING_DATASOURCE_PASSWORD: nnpia